<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, production-ready To-Do list application with instant local persistence, intuitive filtering, keyboard navigation, and light/dark theme support.">
  <meta name="theme-color" content="#4f46e5">
  <title>TaskFlow — Production-Ready To-Do App</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z'/></svg>">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-main">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">TaskFlow</h1>
            <p class="brand-subtitle" id="current-date">Stay organized & productive</p>
          </div>
        </div>

        <div class="header-actions">
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">
            <!-- Sun Icon (shown in dark mode) -->
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon Icon (shown in light mode) -->
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Quick Progress Bar -->
      <div class="progress-section" id="progress-container">
        <div class="progress-header">
          <span class="progress-label" id="progress-status">Overall Progress</span>
          <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar-container" aria-labelledby="progress-status">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="app-card" id="main-content">
      <!-- Task Creation Form -->
      <section class="task-form-section" aria-label="Add task section">
        <form id="todo-form" class="todo-form" novalidate>
          <div class="input-row">
            <div class="input-wrapper">
              <label for="task-input" class="sr-only">New task title</label>
              <input
                type="text"
                id="task-input"
                name="taskTitle"
                class="task-input"
                placeholder="What needs to be done?"
                autocomplete="off"
                maxlength="200"
                aria-describedby="input-feedback"
                required
              >
              <span class="char-counter" id="char-counter" aria-hidden="true">0/200</span>
            </div>

            <!-- Priority Select -->
            <div class="priority-select-wrapper">
              <label for="priority-select" class="sr-only">Task Priority</label>
              <select id="priority-select" class="priority-select" aria-label="Select task priority">
                <option value="medium" selected>Normal</option>
                <option value="high">High</option>
                <option value="low">Low</option>
              </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Add task">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add</span>
            </button>
          </div>
          <div id="input-feedback" class="input-feedback" role="alert" aria-live="polite"></div>
        </form>
      </section>

      <!-- Search & Filter Controls -->
      <section class="controls-section" aria-label="Task filters and search">
        <div class="search-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <label for="search-input" class="sr-only">Search tasks</label>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Search tasks..."
            autocomplete="off"
          >
          <button type="button" id="clear-search-btn" class="clear-search-btn hidden" aria-label="Clear search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="filter-group" role="tablist" aria-label="Task status filters">
          <button
            type="button"
            class="filter-btn active"
            data-filter="all"
            role="tab"
            aria-selected="true"
            id="filter-all"
          >
            All <span class="badge" id="count-all">0</span>
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="active"
            role="tab"
            aria-selected="false"
            id="filter-active"
          >
            Active <span class="badge" id="count-active">0</span>
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="completed"
            role="tab"
            aria-selected="false"
            id="filter-completed"
          >
            Completed <span class="badge" id="count-completed">0</span>
          </button>
        </div>
      </section>

      <!-- Task List Container -->
      <section class="task-list-section" aria-label="Tasks list">
        <ul id="task-list" class="task-list" aria-live="polite">
          <!-- Dynamically populated via script.js -->
        </ul>

        <!-- Empty State Container -->
        <div id="empty-state" class="empty-state hidden" aria-live="polite">
          <div class="empty-icon" id="empty-icon" aria-hidden="true">
            <!-- Icon replaced via JS depending on state -->
          </div>
          <h3 class="empty-title" id="empty-title">No tasks found</h3>
          <p class="empty-desc" id="empty-desc">Get started by creating a new task above!</p>
        </div>
      </section>

      <!-- Task Footer / Meta & Actions -->
      <footer class="task-footer" id="task-footer">
        <div class="task-counts">
          <span id="active-tasks-count" class="active-count-text"><strong>0</strong> items left</span>
        </div>

        <div class="footer-actions">
          <button
            type="button"
            id="clear-completed-btn"
            class="btn btn-secondary btn-sm"
            aria-label="Clear all completed tasks"
            disabled
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear Completed (<span id="clear-count">0</span>)
          </button>
        </div>
      </footer>
    </main>

    <!-- App Instructions / Shortcuts Hint -->
    <aside class="shortcuts-hint" aria-label="Application keyboard shortcuts">
      <span><kbd>Enter</kbd> to add/save</span>
      <span><kbd>Esc</kbd> to cancel edit</span>
      <span>Double-click or click <kbd>✎</kbd> to edit</span>
    </aside>

    <footer class="app-page-footer">
      <p>TaskFlow &bull; Production-Ready Static To-Do Web App &bull; Local Storage Secured</p>
    </footer>
  </div>

  <!-- Toast Notification System -->
  <div id="toast-container" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
